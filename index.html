<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Antecipação D+1 - GFI Pay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0E4949;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        .title {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #0E4949;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0c3e3e;
        }
        .highlight-box {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8f8f8;
            color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .input-group {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f8f8;
            color: black;
            margin-bottom: 20px;
        }
        .input-group p {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
    <script>
        function calcularValorLiquido() {
            const valorVenda = parseFloat(document.getElementById("valorVenda").value) || 0;
            const valorDesejado = parseFloat(document.getElementById("valorDesejado").value) || 0;
            const parcelas = parseInt(document.getElementById("parcelas").value) || 0;
            const bandeira = document.getElementById("bandeira").value;
            const iraReceberBancoSUB = document.getElementById("bancoSUB").checked;
            const lucroDistribuidor = parseFloat(document.getElementById("lucroDistribuidor").value) || 0;

            const taxas = {
                "visa": [1.49, 3.99, 4.90, 5.53, 6.10, 6.73, 7.36, 8.79, 9.44, 10.09, 10.90, 11.42, 11.98, 12.99, 13.71, 14.40, 15.11, 15.78, 16.44, 17.19, 18.29, 18.99],
                "mastercard": [1.49, 3.99, 4.90, 5.53, 6.10, 6.73, 7.36, 8.79, 9.44, 10.09, 10.90, 11.42, 11.98, 12.99, 13.71, 14.40, 15.11, 15.78, 16.44, 17.19, 18.29, 18.99]
            };

            if (!taxas[bandeira] || parcelas < 0 || parcelas >= taxas[bandeira].length) {
                alert("Selecione uma bandeira válida e um número de parcelas correto.");
                return;
            }

            const taxa = taxas[bandeira][parcelas] / 100;

            let valorLiquido;
            if (valorVenda > 0) {
                valorLiquido = valorVenda * (1 - taxa);
                if (iraReceberBancoSUB) {
                    valorLiquido -= valorVenda * 0.0275;
                }
                valorLiquido -= lucroDistribuidor;
                document.getElementById("resultado").innerText = `Valor líquido a receber: R$ ${valorLiquido.toFixed(2)}`;
            } else if (valorDesejado > 0) {
                let valorVendaNecessario = valorDesejado / (1 - taxa);
                if (iraReceberBancoSUB) {
                    valorVendaNecessario = (valorDesejado + (valorDesejado * 0.0275)) / (1 - taxa);
                }
                valorVendaNecessario += lucroDistribuidor;
                document.getElementById("resultado").innerText = `Para receber R$ ${valorDesejado.toFixed(2)} líquidos, deve vender por R$ ${valorVendaNecessario.toFixed(2)}`;
            } else {
                alert("Preencha um dos campos: Valor da venda ou Valor desejado líquido.");
            }
        }
    </script>
</head>
<body>
    <div class="title">GFIpay</div>
    <div class="container">
        <h2>Calculadora de Antecipação D+1</h2>
        
        <div class="input-group">
            <p><strong>Observação:</strong> Preencha um dos campos abaixo. Se deseja saber quanto receberá líquido, preencha apenas o valor da venda. Se deseja saber quanto deve vender para receber um valor líquido específico, preencha apenas o campo de valor líquido.</p>
            <label for="valorVenda">Valor da venda:</label>
            <input type="number" id="valorVenda" placeholder="Digite o valor da venda">
            
            <label for="valorDesejado">Quanto deseja receber líquido:</label>
            <input type="number" id="valorDesejado" placeholder="Digite o valor desejado líquido">
        </div>
        
        <label for="parcelas">Número de parcelas:</label>
        <select id="parcelas">
            <script>
                document.write([...Array(22).keys()].map(i => `<option value="${i}">${i === 0 ? "Débito" : i + "x"}</option>`).join(''));
            </script>
        </select>
        
        <label for="bandeira">Bandeira do cartão:</label>
        <select id="bandeira">
            <option value="visa">Visa</option>
            <option value="mastercard">MasterCard</option>
        </select>
        
        <div class="highlight-box">
            <label for="bancoSUB">Irá receber o valor no Banco SUB?</label>
            <input type="checkbox" id="bancoSUB">
        </div>
        
        <label for="lucroDistribuidor">Lucro do distribuidor (R$):</label>
        <input type="number" id="lucroDistribuidor" placeholder="Digite o valor do lucro">
        
        <button onclick="calcularValorLiquido()">Calcular</button>
        <h3 id="resultado"></h3>
    </div>
</body>
</html>
